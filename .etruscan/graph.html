<style>
:root {
    --bg: #17181c;
    --surface: #1f2127;
    --border: #2c2f37;
    --text: #dcdee6;
    --muted: #8b8f98;
    --accent: #9b7bff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: rgba(23, 24, 28, .88); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
.brand { font-weight: 600; letter-spacing: .02em; }
.brand em { color: var(--accent); font-style: normal; }
input, select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font: inherit; }
input:focus, select:focus { outline: 1px solid var(--accent); }
#search { width: 220px; }
#stats { margin-left: auto; color: var(--muted); font-size: 12px; }
canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
canvas.dragging { cursor: grabbing; }
#legend { position: fixed; left: 14px; bottom: 14px; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; max-width: 46vw; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
#panel { position: fixed; top: 58px; right: 14px; bottom: 14px; width: 330px; z-index: 10; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
#panel .close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
#panel .close:hover { color: var(--text); }
#panel h2 { font-size: 16px; color: var(--accent); word-break: break-all; padding-right: 20px; }
#panel p { margin: 8px 0 12px; color: var(--text); }
#panel dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; margin-bottom: 12px; }
#panel dt { color: var(--muted); }
#panel dd { word-break: break-all; }
#panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
#panel ul { list-style: none; }
#panel li button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 1px 0; }
#panel li button:hover { text-decoration: underline; }
#panel .none { color: var(--muted); font-size: 12px; }
.empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>

</aside>

<script>
'use strict';
(() => {
    const raw = JSON.parse(document.getElementById('etruscan-data').textContent);

    const nodes = raw.nodes.map(node => ({ ...node, x: 0, y: 0, vx: 0, vy: 0 }));
    const nodeById = new Map(nodes.map(node => [node.id, node]));
    const edges = raw.edges
        .filter(edge => nodeById.has(edge.source) && nodeById.has(edge.target))
        .map(edge => ({ source: nodeById.get(edge.source), target: nodeById.get(edge.target) }));

    nodes.forEach(node => { node.outgoing = []; node.incoming = []; });
    edges.forEach(edge => { edge.source.outgoing.push(edge.target); edge.target.incoming.push(edge.source); });
    nodes.forEach((node, index) => {
        node.radius = 5 + Math.min(9, 1.8 * Math.sqrt(node.incoming.length + node.outgoing.length));
        const angle = index * 2.39996;
        const distance = 22 * Math.sqrt(index + 0.5);
        node.x = Math.cos(angle) * distance;
        node.y = Math.sin(angle) * distance;
    });
    const neighbours = new Map(nodes.map(node => [node, new Set([node, ...node.outgoing, ...node.incoming])]));

    const canvas = document.getElementById('graph');
    const context = canvas.getContext('2d');
    let scale = 1;
    let offsetX = canvas.clientWidth / 2;
    let offsetY = canvas.clientHeight / 2;

    if (nodes.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No nodes — annotate classes with #[EtruscanNode] and regenerate.';
        document.body.appendChild(empty);
    }

    document.getElementById('stats').textContent = nodes.length + ' nodes · ' + edges.length + ' links';

    // --- colors -----------------------------------------------------------
    const axisKeys = [...new Set(nodes.flatMap(node => Object.keys(node.axes || {})))].sort();
    const axisSelect = document.getElementById('color-axis');
    axisSelect.append(new Option('no color axis', ''));
    axisKeys.forEach(key => axisSelect.append(new Option('color: ' + key, key)));
    axisSelect.value = axisKeys[0] || '';

    const FALLBACK_COLOR = '#8b8f98';
    let colorByValue = new Map();

    const axisValue = (node, axisKey) => {
        const value = (node.axes || {})[axisKey];
        return Array.isArray(value) ? value[0] : value;
    };

    const recolor = () => {
        colorByValue = new Map();
        const axisKey = axisSelect.value;
        nodes.forEach(node => {
            const value = axisKey === '' ? undefined : axisValue(node, axisKey);
            if (value === undefined) {
                node.color = axisKey === '' ? 'hsl(262 70% 68%)' : FALLBACK_COLOR;
                return;
            }
            if (!colorByValue.has(value)) {
                colorByValue.set(value, 'hsl(' + (colorByValue.size * 137.508 % 360).toFixed(1) + ' 62% 62%)');
            }
            node.color = colorByValue.get(value);
        });
        const legend = document.getElementById('legend');
        legend.textContent = '';
        [...colorByValue.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([value, color]) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            const dot = document.createElement('i');
            dot.style.background = color;
            chip.append(dot, value);
            legend.appendChild(chip);
        });
    };
    axisSelect.addEventListener('change', () => recolor());
    recolor();

    // --- highlight state --------------------------------------------------
    let hoveredNode = null;
    let selectedNode = null;
    let query = '';
    document.getElementById('search').addEventListener('input', event => {
        query = event.target.value.trim().toLowerCase();
    });

    const matchesQuery = node =>
        node.id.toLowerCase().includes(query)
        || (node.class || '').toLowerCase().includes(query)
        || (node.fqcn || '').toLowerCase().includes(query);

    const highlightSet = () => {
        if (query !== '') return new Set(nodes.filter(matchesQuery));
        const focus = selectedNode || hoveredNode;
        return focus ? neighbours.get(focus) : null;
    };

    // --- panel ------------------------------------------------------------
    const panel = document.getElementById('panel');
    document.getElementById('panel-close').addEventListener('click', () => { selectedNode = null; panel.hidden = true; });

    const fillLinkList = (element, linkedNodes) => {
        element.textContent = '';
        if (linkedNodes.length === 0) {
            const item = document.createElement('li');
            item.className = 'none';
            item.textContent = '—';
            element.appendChild(item);
            return;
        }
        linkedNodes.forEach(linked => {
            const item = document.createElement('li');
            const button = document.createElement('button');
            button.textContent = linked.id;
            button.addEventListener('click', () => select(linked));
            item.appendChild(button);
            element.appendChild(item);
        });
    };

    const select = node => {
        selectedNode = node;
        panel.hidden = false;
        document.getElementById('panel-alias').textContent = node.id;
        document.getElementById('panel-description').textContent = node.description || '';
        const meta = document.getElementById('panel-meta');
        meta.textContent = '';
        const rows = [['class', node.class], ['fqcn', node.fqcn], ['extends', node.extends], ['source', node.source]];
        Object.entries(node.axes || {}).forEach(([key, value]) => rows.push([key, Array.isArray(value) ? value.join(', ') : value]));
        rows.filter(([, value]) => value).forEach(([term, value]) => {
            const dt = document.createElement('dt');
            dt.textContent = term;
            const dd = document.createElement('dd');
            dd.textContent = value;
            meta.append(dt, dd);
        });
        fillLinkList(document.getElementById('panel-out'), node.outgoing);
        fillLinkList(document.getElementById('panel-in'), node.incoming);
        offsetX = canvas.clientWidth / 2 - node.x * scale;
        offsetY = canvas.clientHeight / 2 - node.y * scale;
        reheat();
    };

    // --- simulation -------------------------------------------------------
    const REPULSION = 900;
    const LINK_DISTANCE = 80;
    const SPRING = 0.06;
    const GRAVITY = 0.012;
    const DAMPING = 0.85;
    const DECAY = 0.99;
    let alpha = 1;
    let fitted = false;
    let draggedNode = null;

    const reheat = () => { alpha = Math.max(alpha, 0.4); };

    const step = () => {
        for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            for (let j = i + 1; j < nodes.length; j++) {
                const b = nodes[j];
                let dx = a.x - b.x;
                let dy = a.y - b.y;
                let squared = dx * dx + dy * dy;
                if (squared < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; squared = 1; }
                if (squared > 250000) continue;
                const distance = Math.sqrt(squared);
                const force = (REPULSION * alpha) / squared;
                a.vx += (dx / distance) * force;
                a.vy += (dy / distance) * force;
                b.vx -= (dx / distance) * force;
                b.vy -= (dy / distance) * force;
            }
        }
        edges.forEach(({ source, target }) => {
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const distance = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
            const force = (distance - LINK_DISTANCE) * SPRING * alpha;
            source.vx += (dx / distance) * force;
            source.vy += (dy / distance) * force;
            target.vx -= (dx / distance) * force;
            target.vy -= (dy / distance) * force;
        });
        nodes.forEach(node => {
            if (node === draggedNode) { node.vx = 0; node.vy = 0; return; }
            node.vx = (node.vx - node.x * GRAVITY * alpha) * DAMPING;
            node.vy = (node.vy - node.y * GRAVITY * alpha) * DAMPING;
            node.x += node.vx;
            node.y += node.vy;
        });
        alpha *= DECAY;
    };

    const fitToView = () => {
        if (nodes.length === 0) { offsetX = canvas.clientWidth / 2; offsetY = canvas.clientHeight / 2; return; }
        const xs = nodes.map(node => node.x);
        const ys = nodes.map(node => node.y);
        const minX = Math.min(...xs) - 80;
        const maxX = Math.max(...xs) + 80;
        const minY = Math.min(...ys) - 80;
        const maxY = Math.max(...ys) + 80;
        scale = Math.min(canvas.clientWidth / (maxX - minX), canvas.clientHeight / (maxY - minY), 1.5);
        offsetX = canvas.clientWidth / 2 - ((minX + maxX) / 2) * scale;
        offsetY = canvas.clientHeight / 2 - ((minY + maxY) / 2) * scale;
    };

    // --- painting ---------------------------------------------------------
    const resize = () => {
        const ratio = window.devicePixelRatio || 1;
        canvas.width = canvas.clientWidth * ratio;
        canvas.height = canvas.clientHeight * ratio;
    };
    window.addEventListener('resize', resize);
    resize();

    const draw = () => {
        const ratio = window.devicePixelRatio || 1;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        context.translate(offsetX, offsetY);
        context.scale(scale, scale);

        const highlighted = highlightSet();
        const isDim = node => highlighted !== null && !highlighted.has(node);

        context.lineWidth = 1 / scale;
        edges.forEach(({ source, target }) => {
            const bright = highlighted !== null && highlighted.has(source) && highlighted.has(target)
                && (query !== '' || selectedNode === source || selectedNode === target
                    || hoveredNode === source || hoveredNode === target);
            context.strokeStyle = bright ? 'rgba(155, 123, 255, 0.55)'
                : highlighted !== null ? 'rgba(140, 145, 155, 0.06)'
                : 'rgba(140, 145, 155, 0.18)';
            context.beginPath();
            context.moveTo(source.x, source.y);
            context.lineTo(target.x, target.y);
            context.stroke();
        });

        nodes.forEach(node => {
            context.globalAlpha = isDim(node) ? 0.15 : 1;
            context.fillStyle = node.color;
            context.beginPath();
            context.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            context.fill();
            if (node === selectedNode || node === hoveredNode) {
                context.strokeStyle = '#ffffff';
                context.lineWidth = 1.5 / scale;
                context.stroke();
            }
        });

        const labelAll = scale > 0.9;
        context.font = (11 / scale) + 'px sans-serif';
        context.textAlign = 'center';
        nodes.forEach(node => {
            const emphasised = highlighted !== null && highlighted.has(node);
            if (!labelAll && !emphasised) return;
            context.globalAlpha = isDim(node) ? 0.1 : emphasised ? 0.95 : 0.65;
            context.fillStyle = '#dcdee6';
            context.fillText(node.id, node.x, node.y + node.radius + 12 / scale);
        });
        context.globalAlpha = 1;
    };

    const loop = () => {
        if (alpha > 0.005 || draggedNode !== null) step();
        if (!fitted && alpha < 0.35) { fitToView(); fitted = true; }
        draw();
        requestAnimationFrame(loop);
    };
    loop();

    // --- interaction ------------------------------------------------------
    const worldPoint = event => {
        const bounds = canvas.getBoundingClientRect();
        return {
            x: (event.clientX - bounds.left - offsetX) / scale,
            y: (event.clientY - bounds.top - offsetY) / scale,
        };
    };

    const nodeAt = point => {
        for (let i = nodes.length - 1; i >= 0; i--) {
            const node = nodes[i];
            const dx = node.x - point.x;
            const dy = node.y - point.y;
            if (dx * dx + dy * dy <= (node.radius + 4 / scale) ** 2) return node;
        }
        return null;
    };

    let panning = false;
    let panStart = null;
    let moved = false;

    canvas.addEventListener('mousedown', event => {
        const hit = nodeAt(worldPoint(event));
        moved = false;
        if (hit) {
            draggedNode = hit;
        } else {
            panning = true;
            panStart = { x: event.clientX - offsetX, y: event.clientY - offsetY };
        }
        canvas.classList.add('dragging');
    });

    window.addEventListener('mousemove', event => {
        if (draggedNode) {
            const point = worldPoint(event);
            draggedNode.x = point.x;
            draggedNode.y = point.y;
            moved = true;
            reheat();
            return;
        }
        if (panning) {
            offsetX = event.clientX - panStart.x;
            offsetY = event.clientY - panStart.y;
            moved = true;
            return;
        }
        hoveredNode = nodeAt(worldPoint(event));
        canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
    });

    window.addEventListener('mouseup', event => {
        if (draggedNode && !moved) select(draggedNode);
        if (panning && !moved && event.target === canvas) { selectedNode = null; panel.hidden = true; }
        draggedNode = null;
        panning = false;
        canvas.classList.remove('dragging');
    });

    canvas.addEventListener('wheel', event => {
        event.preventDefault();
        const bounds = canvas.getBoundingClientRect();
        const pointerX = event.clientX - bounds.left;
        const pointerY = event.clientY - bounds.top;
        const factor = Math.exp(-event.deltaY * 0.0012);
        const nextScale = Math.min(Math.max(scale * factor, 0.1), 5);
        offsetX = pointerX - ((pointerX - offsetX) / scale) * nextScale;
        offsetY = pointerY - ((pointerY - offsetY) / scale) * nextScale;
        scale = nextScale;
    }, { passive: false });

    window.addEventListener('keydown', event => {
        if (event.key === 'Escape') { selectedNode = null; panel.hidden = true; }
    });
})();
</script>
</body>
</html>
