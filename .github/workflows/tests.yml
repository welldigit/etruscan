name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependencies }} deps
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        # `lowest` proves the declared floor of every constraint actually
        # builds the package — the floor a consumer is entitled to install.
        dependencies: [highest, lowest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Rector, Pint, PHPStan, Pest
        run: composer check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: pcov

      # `highest` stated explicitly: this package does not commit composer.lock,
      # so the action's default `locked` mode has no lock file to install from.
      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Pest with coverage
        run: composer test:coverage

  audit:
    name: Security advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      # Fails on advisories against the packages this one actually ships.
      - name: Runtime dependencies
        run: composer audit --no-dev --no-interaction

      # Dev-only advisories are surfaced without failing: they reach nobody
      # through `composer require welldigit/etruscan`, and they are generally
      # the consumer's own framework to update.
      - name: Dev dependencies (report only)
        if: always()
        run: composer audit --no-interaction || true
